<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Inventário de cenários | ServeRest Playwright</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #17243b; background: #f3f6fb; line-height: 1.65; scroll-behavior: smooth; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #1259a6; text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible { outline: 3px solid #ec8c20; outline-offset: 3px; }
    code { font-family: Consolas, monospace; font-size: .9em; overflow-wrap: anywhere; }
    header { background: #10233f; color: #fff; padding: 3rem 1.5rem; }
    header p { color: #d3deec; margin-bottom: 0; }
    header a { color: #b7eee8; }
    h1 { font-size: clamp(2rem, 5vw, 3.3rem); line-height: 1.1; margin: 0; }
    h2 { margin-top: 0; font-size: 1.5rem; }
    h3 { font-size: 1.1rem; }
    .wrap { max-width: 1180px; margin: auto; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.5rem; align-items: start; padding: 1.5rem; }
    nav { position: sticky; top: 1rem; }
    nav strong { display: block; color: #52647a; font-size: .8rem; text-transform: uppercase; }
    nav a { display: block; padding: .3rem 0; text-decoration: none; }
    .panel, section { background: #fff; border: 1px solid #dfe7f1; border-radius: 14px; padding: 1.3rem; box-shadow: 0 8px 24px #17243b0b; }
    section { margin-bottom: 1.2rem; scroll-margin-top: 1rem; }
    details { border: 1px solid #dfe7f1; border-radius: 10px; margin: .8rem 0; }
    summary { cursor: pointer; font-weight: 700; padding: 1rem; }
    summary:hover { background: #f5fafb; }
    .detail-body { padding: 0 1rem 1rem; border-top: 1px solid #e6ecf3; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; text-align: left; font-size: .93rem; }
    th, td { padding: .7rem; border-bottom: 1px solid #e6ecf3; vertical-align: top; }
    th { color: #52647a; }
    li { padding: .15rem 0; }
    footer { padding: 0 1.5rem 2rem; color: #52647a; font-size: .85rem; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } nav { position: static; } nav a { display: inline-block; margin-right: 1rem; } }
    @media print { header { color: #17243b; background: none; } header p, header a { color: #17243b; } nav { display: none; } .layout { display: block; } section { box-shadow: none; } }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>Inventário de cenários</h1><p>ServeRest Playwright · <a href="INVENTARIO_CENARIOS.md">Fonte em Markdown</a></p></div></header>
  <main class="wrap layout">
    <nav class="panel" aria-label="Navegação do inventário"><strong>Navegação</strong><!-- INVENTORY_NAV --></nav>
    <article><!-- INVENTORY_CONTENT --></article>
  </main>
  <footer class="wrap">Gerado a partir de INVENTARIO_CENARIOS.md.</footer>
</body>
</html>
